version: "2"

linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    - noctx
    - unconvert
    # style
    - misspell
    - whitespace
    # performance
    - prealloc
    # code quality
    - gocritic
    - unparam
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/moolen/keel

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - hugeParam
      - whyNoLint

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m

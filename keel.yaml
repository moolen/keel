image: ghcr.io/moolen/keel-devtools:main

resources:
  vcpu: 2
  memory_mb: 1024
  disk_mb: 4096

workspace:
  mount: .
  target: /workspace
  sync_back: true
  sync_deletes: true
  sync_confirm: false

network:
  mode: vsock
  audit: true
  endpoints:
    - host: "*.github.com"
      port: 443
      tls:
        require_sni_match: true
    - host: archive.ubuntu.com
      port: 80
    - host: security.ubuntu.com
      port: 80
  ip_rules: []

features:
  - name: docker
    config:
      storage_driver: vfs

env:
  static:
    TERM: xterm-256color
